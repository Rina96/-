version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: julia_postgres
    environment:
      POSTGRES_DB: julia_ai
      POSTGRES_USER: julia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-julia_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julia -d julia_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - julia_network

  # Julia API Application
  app:
    build: .
    container_name: julia_app
    environment:
      DATABASE_URL: postgresql+asyncpg://julia:${DB_PASSWORD:-julia_password}@postgres:5432/julia_ai
      DEBUG: "False"
      PORT: 8000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GREEN_API_ID_INSTANCE: ${GREEN_API_ID_INSTANCE}
      GREEN_API_API_TOKEN_INSTANCE: ${GREEN_API_API_TOKEN_INSTANCE}
      ALFA_EMAIL: ${ALFA_EMAIL}
      ALFA_API_KEY: ${ALFA_API_KEY}
      ALFA_APP_KEY: ${ALFA_APP_KEY}
      ALFA_BASE_URL: ${ALFA_BASE_URL}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/var/log/julia
    restart: always
    networks:
      - julia_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: julia_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./client_dashboard.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - app
    restart: always
    networks:
      - julia_network

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: julia_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - julia_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  julia_network:
    driver: bridge
